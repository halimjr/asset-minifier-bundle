name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        symfony: ['6.4', '7.4', '8.1']
        exclude:
          # Symfony 7.4 requires PHP 8.2+, Symfony 8.x requires PHP 8.4+.
          - php: '8.1'
            symfony: '7.4'
          - php: '8.1'
            symfony: '8.1'
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      # Pin every Symfony package to the same minor so the job really tests that version.
      - name: Pin Symfony version
        env:
          SF: ${{ matrix.symfony }}
        run: |
          composer require --no-update \
            "symfony/asset-mapper:$SF.*" "symfony/config:$SF.*" "symfony/console:$SF.*" \
            "symfony/dependency-injection:$SF.*" "symfony/http-kernel:$SF.*" "symfony/process:$SF.*"
          composer require --dev --no-update \
            "symfony/framework-bundle:$SF.*" "symfony/phpunit-bridge:$SF.*"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Show installed Symfony versions
        run: composer show 'symfony/*'

      # PHPUnit exits 0 on notices and deprecations by default; fail on every issue where supported (11.x+).
      - name: Run tests
        run: |
          if vendor/bin/phpunit --help | grep -q -- '--fail-on-all-issues'; then
            vendor/bin/phpunit --fail-on-all-issues
          else
            vendor/bin/phpunit
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit
